<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>行き先決め - 旅行計画アプリ</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <a class="back-link" id="back-link" href="trip.html">← 旅行詳細に戻る</a>
    </header>
    <h1>行き先決め</h1>
    <p class="subtitle">候補地を追加し、★1〜5で投票しましょう。平均スコアの高い順に表示されます。</p>

    <form id="destination-form" novalidate>
      <div class="field">
        <label for="destination-name">候補地名</label>
        <input type="text" id="destination-name" name="name" required />
      </div>
      <div class="field">
        <label for="destination-note">メモ</label>
        <input type="text" id="destination-note" name="note" />
      </div>
      <p class="error-text" id="destination-error-text"></p>
      <button type="submit">候補地を追加</button>
    </form>

    <div id="destination-list"></div>
  </main>
  <script type="module" src="destinations.js"></script>
</body>
</html>
