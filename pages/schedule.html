<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日程調整 - 旅行計画アプリ</title>
  <link rel="stylesheet" href="shared.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <a class="back-link" id="back-link" href="trip.html">← 旅行詳細に戻る</a>
    </header>
    <h1>日程調整</h1>
    <p class="subtitle">候補日を追加し、○(参加できる)・△(未定)・×(参加できない)で回答しましょう。</p>

    <form id="date-form" novalidate>
      <div class="field">
        <label for="date-input">候補日</label>
        <input type="date" id="date-input" name="date" required />
      </div>
      <p class="error-text" id="date-error-text"></p>
      <button type="submit">候補日を追加</button>
    </form>

    <div id="schedule-list"></div>
  </main>
  <script type="module" src="schedule.js"></script>
</body>
</html>
